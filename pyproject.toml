[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meal-planning-concierge-agent"
version = "1.0.0"
description = "Production-ready Meal Planning Concierge Multi-Agent System built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.14.0",
    "google-genai>=2.0.0",
    "pydantic>=2.10.0",
    "aiosqlite>=0.20.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
gcp = [
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-dlp>=3.20.0",
    "google-cloud-discoveryengine>=0.13.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["meal_planner_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"evals/run_evaluations.py" = ["E402"]
